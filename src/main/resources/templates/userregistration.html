
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>User Registration</title>
</head>
<body>
	
	<form th:action="@{/register}" th:object="${simpleUser}" method="post">
	
		<input type="text" th:field="*{userName}" placeholder="Enter your Username">
		<p style="color:red;" th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}"></p>
		
		<input type="text" th:field="*{email}" placeholder="Enter your Email">
		<p style="color:red;" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
		
		<input type="text" th:field="*{password}" placeholder="Enter your Passwprd">
		<p style="color:red;" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
		
		<button type="submit">Submit</button>
	</form>

</body>
</html>
